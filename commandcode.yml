name: harness-claude

services:
  commandcode:
    image: debian:bookworm-slim
    container_name: commandcode
    hostname: commandcode
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/commandcode.sh"]
    restart: unless-stopped

