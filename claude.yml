services:
  claude:
    image: debian:bookworm-slim
    container_name: claude
    hostname: claude
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/claude.sh"]
    restart: unless-stopped