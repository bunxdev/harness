name: harness-claude
services:
  claude:
    image: debian:bookworm-slim
    container_name: claude
    hostname: claude
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - ./scripts/claude-managed-settings.json:/etc/claude-code/managed-settings.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/claude.sh"]
    restart: unless-stopped
    environment:
      ANTHROPIC_BASE_URL: http://127.0.0.1:3000
      ANTHROPIC_AUTH_TOKEN: ${CLAUDE_GATEWAY_TOKEN:-sk-ant-opencode-internal}
      ANTHROPIC_MODEL: claude-opencode-nemotron-3.5-lightning-free
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-opencode-nemotron-3.5-lightning-free
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opencode-nemotron-3-ultra-free
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-opencode-muse-spark-1.3-contributor-free
      CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
      CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING: "1"
      CLAUDE_CODE_DISABLE_1M_CONTEXT: "1"
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "160000"
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32000"
      CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
      DISABLE_PROMPT_CACHING: "1"
      DISABLE_AUTOUPDATER: "1"
      MAX_THINKING_TOKENS: "0"
      CLAUDE_CODE_VERSION: "2.1.261"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null && [ \"$$(claude --version)\" = \"$$CLAUDE_CODE_VERSION (Claude Code)\" ]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
