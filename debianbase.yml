services:
  debianbase:
    build:
      context: .
      dockerfile: Dockerfiles/debian12-slim/Dockerfile
    image: debianbase:debian12-slim
    container_name: debianbase
    hostname: debianbase
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/debianbase.sh"]
    restart: unless-stopped