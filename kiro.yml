services:
  kiro:
    image: debian
    container_name: kiro
    hostname: kiro
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/kiro.sh"]
    restart: unless-stopped