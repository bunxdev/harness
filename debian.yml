services:
  debian:
    build:
      context: .
      dockerfile: Dockerfiles/debian/Dockerfile
    image: debian
    container_name: debian
    hostname: debian
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/debian.sh"]
    restart: unless-stopped