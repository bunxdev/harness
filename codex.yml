services:
  codex:
    image: debian:bookworm-slim
    container_name: codex
    hostname: codex
    network_mode: "host"
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    command: ["/bin/bash", "/scripts/codex.sh"]
    restart: unless-stopped